/**:
  ros__parameters:
    # Each profile is loaded by both box_localizer and pick_place_server. The
    # localizer resolves AprilTag IDs to profile IDs; the server resolves the
    # profile ID to collision and grasp geometry at goal acceptance.
    box_profiles_tag_frame_prefix: tag
    box_profiles:
      small_carton:
        tag_ids: [0]
        dimensions: [0.15, 0.36, 0.32]  # length X, width Y, height Z [m]
        # Measured tag-frame to physical box-center transform.
        tag_to_box_center_pose: [0.0, 0.0, -0.16, 0.0, 0.0, 0.0, 1.0]
        pregrasp_distance: 0.08
        contact_height_offset: 0.0
        # These migration baselines preserve the former legacy carry target.
        # Validate and calibrate this profile on hardware with plan_only before execution.
        carry_pose_a: [0.25, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
        carry_pose_b: [0.25, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
      grey_box:
        tag_ids: [180]
        dimensions: [0.30, 0.40, 0.12]
        # This preserves the existing measured pickup center without applying
        # its tag-mount calibration to the table placement target.
        tag_to_box_center_pose: [0.0, 0.0, 0.06, 0.0, 0.0, 0.0, 1.0]
        pregrasp_distance: 0.08
        contact_height_offset: 0.0
        # Default migration baseline. Validate this profile on hardware with
        # plan_only before allowing execution.
        carry_pose_a: [0.35, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
        # Carry B has not yet been calibrated independently for this profile.
        carry_pose_b: [0.35, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
