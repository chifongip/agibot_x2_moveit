/**:
  ros__parameters:
    # Each profile is loaded by both box_localizer and pick_place_server. The
    # localizer resolves AprilTag IDs to profile IDs; the server resolves the
    # profile ID to collision and grasp geometry at goal acceptance.
    box_profiles_tag_frame_prefix: tag
    # Carry A/B are box-center poses [x,y,z,qx,qy,qz,qw] in torso_link.
    box_profiles:
      small_carton:
        # Associate small_carton_dock after mounting the tag vertically and
        # recalibrating tag_to_box_center_pose. This profile uses a top tag.
        tag_ids: [0]
        dimensions: [0.15, 0.35, 0.32]  # length X, width Y, height Z [m]
        # Measured tag-frame to physical box-center transform.
        tag_to_box_center_pose: [0.03, 0.0, -0.16, 0.0, 0.0, 0.0, 1.0]
        pregrasp_distance: 0.05
        contact_height_offset: 0.1
        # Existing numeric targets are retained and interpreted in torso_link.
        # Validate and calibrate this profile on hardware with plan_only before execution.
        carry_pose_a: [0.35, 0.0, 0.25, 0.0, 0.0, 0.0, 1.0]
        carry_pose_b: [0.25, 0.0, 0.05, 0.0, 0.0, 0.0, 1.0]
      grey_box:
        docking_profile_ids: [grey_box_dock]
        default_docking_profile: grey_box_dock
        tag_ids: [180]
        dimensions: [0.30, 0.40, 0.12]
        # Centered vertical tag: +X right, +Y up, +Z toward the robot.
        # Box center is 0.15 m behind the tag; box axes align with tag -Z, -X, +Y.
        tag_to_box_center_pose: [0.0, 0.0, -0.15, -0.5, 0.5, 0.5, 0.5]
        pregrasp_distance: 0.05
        contact_height_offset: 0.04
        # Default migration baseline. Validate this profile on hardware with
        # plan_only before allowing execution.
        carry_pose_a: [0.35, 0.0, 0.15, 0.0, 0.0, 0.0, 1.0]
        # Carry B has not yet been calibrated independently for this profile.
        carry_pose_b: [0.3, 0.0, -0.05, 0.0, 0.0, 0.0, 1.0]
