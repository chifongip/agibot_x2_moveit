box_localizer:
  ros__parameters:
    planning_frame: base_link
    tag_frame: tag0
    detections_topic: /detections
    tag_id: 0
    box_states_topic: /box_states
    box_dimensions: [0.15, 0.36, 0.32]  # length X, width Y, height Z [m]
    tag_to_box_yaw: 0.0
    # Additional [x, y, z] correction from the centered top-tag model, in tag coordinates [m].
    tag_to_box_offset: [0.04, 0.0, 0.1]
    stable_sample_count: 3
    maximum_pose_age: 2.5
    maximum_position_spread: 0.005
    maximum_angular_spread: 0.0523598776  # 3 degrees
    maximum_box_tilt: 0.3490658504        # 20 degrees from base +Z
    minimum_decision_margin: 20.0

pick_place_server:
  ros__parameters:
    planning_frame: base_link
    box_pose_topic: /box_pose
    box_states_topic: /box_states
    # Model every fresh non-target profile instance as a MoveIt obstacle.
    visible_boxes_as_obstacles: true
    planning_group: dual_arm
    left_group: left_arm
    right_group: right_arm
    left_tcp: left_hand_tcp_link
    right_tcp: right_hand_tcp_link
    box_id: grasp_box
    box_dimensions: [0.15, 0.36, 0.32]
    pregrasp_distance: 0.08
    contact_height_offset: 0.0
    lift_height: 0.08
    cartesian_step: 0.01
    maximum_box_pose_age: 2.5
    ik_timeout: 0.05
    # Coordinated dual-arm search. These are shared grasp hypotheses, not
    # independent per-hand pose tolerances.
    grasp_position_tolerance: 0.1
    grasp_orientation_tolerance: 0.1745329252  # 10 degrees
    pregrasp_distance_tolerance: 0.020
    alternate_face_alignment_tolerance: 0.261799388  # 15 degrees from best face pair
    maximum_grasp_candidates: 128
    grasp_search_timeout: 4.0
    ik_attempts_per_candidate: 8
    maximum_planning_candidates: 5
    planning_time_per_candidate: 2.0
    pregrasp_planning_timeout: 60.0
    maximum_retry_candidates: 3
    minimum_grasp_joint_margin: 0.02  # rad; avoid grasps that cannot move away from a limit
    # Carry routes must retain at least the same clearance as a selected grasp.
    minimum_carry_joint_margin: 0.02
    closed_chain_position_tolerance: 0.010
    closed_chain_orientation_tolerance: 0.0523598776  # 3 degrees
    closed_chain_position_step: 0.005
    closed_chain_orientation_step: 0.0261799388  # 1.5 degrees
    closed_chain_ik_attempts: 4
    closed_chain_ik_timeout: 0.10
    closed_chain_beam_width: 8
    closed_chain_solutions_per_branch: 2
    closed_chain_projection_limit: 32
    closed_chain_validation_position_step: 0.005
    closed_chain_validation_orientation_step: 0.0174533
    closed_chain_contact_position_error: 0.1
    closed_chain_contact_orientation_error: 0.1745329252  # 10 degrees
    carry_search_timeout: 80.0
    maximum_carry_candidates: 270
    carry_search_x_range: 0.05
    carry_search_y_range: 0.05
    carry_search_z_lower: 0.02
    carry_search_z_upper: 0.05
    carry_search_orientation_tolerance: 0.0872664626  # 5 degrees
    # Save a timestamped planning-YYYYMMDD-HHMMSS-PID.jsonl trace for every
    # planner-server start. The timestamp uses the host's local time.
    planning_log_directory: /tmp/agibot_x2_planning_traces
    # Optional absolute JSON Lines trace file. When set, it overrides the
    # automatic timestamped destination above.
    planning_log_file: ""
    # Bounded local correction only; a placement-region planner is required
    # before allowing larger shifts from the requested final box pose.
    adaptive_place_position_tolerance: [0.05, 0.05, 0.02]
    adaptive_place_yaw_tolerance: 0.0872664626  # 5 degrees
    # An empty action place_pose is resolved from tag9. Its frame uses +X right,
    # +Y up, and +Z toward the robot. The tabletop center is a single source
    # of truth for both placement and the MoveIt table collision box.
    # At zero yaw, box +X, +Y, and +Z align with tag -Z, -X, and +Y.
    use_tag_derived_place_pose: true
    table_tag_frame: tag9
    table_tag_to_tabletop_center: [0.0, -0.55, 0.15]
    # [x, z] in the tabletop plane relative to the calibrated center. The z
    # value preserves the former tag-relative target at z=0.20 m.
    table_tag_place_offset: [0.0, 0.05]
    table_tag_to_box_yaw: 0.0
    table_collision_enabled: true
    table_collision_id: work_table
    # [length along tag +X, depth along tag -Z, height along tag +Y] [m].
    table_dimensions: [0.6, 0.4, 0.6]
    maximum_table_tag_pose_age: 2.5
    table_tag_detections_topic: /front_center_rectify/detections
    table_tag_id: 9
    table_tag_minimum_decision_margin: 20.0
    table_tag_stable_sample_count: 3
    table_tag_maximum_position_spread: 0.005
    table_tag_maximum_angular_spread: 0.0523598776  # 3 degrees
    table_tag_maximum_sample_gap: 2.5  # s; reset after a detector outage
    table_tag_stability_timeout: 10.0
    maximum_joint_step: 0.35
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    # Legacy-only carry targets for a deployment without box_profiles. When a
    # profile catalog is loaded, each profile must supply carry_pose_a and may
    # supply carry_pose_b; those profile values are used for Pick, recovery,
    # and /move_carry_pose instead. Carry B intentionally starts identical to
    # Carry A here so legacy deployments do not gain a new motion implicitly.
    # carry_box_pose remains a backward-compatible alias for Carry A when
    # carry_box_pose_a is not supplied.
    carry_box_pose_a: [0.25, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
    carry_box_pose_b: [0.25, 0.0, 0.34, 0.0, 0.0, 0.0, 1.0]
    recovery_position_tolerance: 0.1
    recovery_angular_tolerance: 0.1745329252  # 10 degrees
    # Permit a small measured encoder/model discrepancy before Place. This is
    # not a replacement for calibrated URDF position limits.
    place_start_state_bounds_tolerance: 0.02  # rad, about 1.15 degrees
    initial_state: empty
    post_place_named_target: zero
    # Independent post-release OMPL search; calibration and held-box mode are unchanged.
    return_planning_timeout: 30.0
    return_planning_time_per_attempt: 2.0
    return_ik_attempts: 8
    return_up_offsets: [0.05, 0.10, 0.15, 0.20]
    return_back_offsets: [0.0, 0.05, 0.10]
    return_out_offsets: [0.0, 0.04]
    return_longest_valid_segment_fraction: 0.005
    return_validation_joint_step: 0.01  # rad; check interpolated edges after timing
    return_path_tolerance: 0.01  # TOTG joint-space deviation tolerance
    reset_named_target: zero
    reset_preemption_timeout: 15.0
    reset_state_timeout: 2.0
    reset_joint_tolerance: 0.1
    # Validate these against measured hardware tracking. The server requires
    # direct post-execution feedback satisfying them before any following phase.
    execution_settle_timeout: 10.0
    execution_joint_tolerance: 0.1
    execution_velocity_tolerance: 0.05
    execution_settle_samples: 3
    # Independent RoboJuDo locomanipulation posture control. The startup launch
    # supplies posture_zmq_enabled so operators can disable it explicitly.
    # Port 8557 and this JSON protocol are intentionally separate from the
    # ros2_control arm-command PUB transport on port 8559.
    posture_zmq_publish_rate_hz: 50.0
    posture_settle_timeout: 10.0
    posture_settle_duration: 0.25
    posture_settle_samples: 3
    simulate_ideal_attachment: false
    attach_service: /mujoco_grasp/attach
    detach_service: /mujoco_grasp/detach
    # Source and motion-mode selection are supplied by box_pick_place.launch.py.
    # Do not define them in this node-scoped YAML: exact-node parameters override
    # launch values.
    depth_filtered_cloud_topic: /x2/moveit/depth_filtered_cloud
    lidar_filtered_cloud_topic: /x2/moveit/lidar_filtered_cloud
    octomap_clear_service: /clear_octomap
    octomap_refill_timeout: 3.0
    octomap_post_clear_samples: 2
    maximum_filtered_cloud_age: 1.0
    maximum_filtered_cloud_future_skew: 0.10
    octomap_processing_delay: 0.10
