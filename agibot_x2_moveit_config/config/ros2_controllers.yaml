# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # Keep enough host/DDS headroom for the independent 100 ms HAL watchdogs.
    update_rate: 100

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

dual_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # A trajectory result must reflect measured endpoint convergence. Values
    # mirror the manipulation server's execution gate and must be calibrated
    # from real arm tracking data before real-robot deployment.
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      left_shoulder_pitch_joint: {goal: 0.02}
      left_shoulder_roll_joint: {goal: 0.02}
      left_shoulder_yaw_joint: {goal: 0.02}
      left_elbow_joint: {goal: 0.02}
      left_wrist_yaw_joint: {goal: 0.02}
      left_wrist_pitch_joint: {goal: 0.02}
      left_wrist_roll_joint: {goal: 0.02}
      right_shoulder_pitch_joint: {goal: 0.02}
      right_shoulder_roll_joint: {goal: 0.02}
      right_shoulder_yaw_joint: {goal: 0.02}
      right_elbow_joint: {goal: 0.02}
      right_wrist_yaw_joint: {goal: 0.02}
      right_wrist_pitch_joint: {goal: 0.02}
      right_wrist_roll_joint: {goal: 0.02}

joint_state_broadcaster:
  ros__parameters:
    # MoveIt does not need joint states at the hardware control-loop rate.
    update_rate: 50
